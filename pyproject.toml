[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karpathy-copilot-wiki"
version = "0.1.0"
description = "VS Code-native wiki system with AI-assisted ingestion and semantic linking"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "User", email = "user@example.com"}]

dependencies = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "spacy>=3.7.0",
    "sentence-transformers>=2.2.0",
    "jinja2>=3.1.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
